<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strawberry Matcha Latte — Hyper-Realistic 3D</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d10; }
  #app { width: 100vw; height: 100vh; display: block; }
  .hud {
    position: fixed; left: 18px; bottom: 16px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8e8ea; text-shadow: 0 1px 2px rgba(0,0,0,.6);
    pointer-events: none; user-select: none;
  }
  .hud b { font-weight: 600; }
  .hud span { opacity: .7; }
  #loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 14px -apple-system, sans-serif; color: #cfcfd4; letter-spacing: .04em;
    background: #0d0d10; transition: opacity .6s ease; z-index: 10;
  }
  #loader.hidden { opacity: 0; pointer-events: none; }
  #snap {
    position: fixed; right: 18px; bottom: 16px;
    font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #11140f; background: #cfe39a; border: none; border-radius: 999px;
    padding: 10px 18px; cursor: pointer; letter-spacing: .02em;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: transform .12s ease, background .2s ease;
    z-index: 11;
  }
  #snap:hover { background: #dcecae; transform: translateY(-1px); }
  #snap:active { transform: translateY(0); }
  #snap:disabled { opacity: .6; cursor: default; }
  #rec {
    position: fixed; right: 18px; bottom: 58px;
    font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1a1410; background: #e6c79a; border: none; border-radius: 999px;
    padding: 10px 18px; cursor: pointer; letter-spacing: .02em;
    box-shadow: 0 6px 18px rgba(0,0,0,.35); transition: transform .12s ease, background .2s ease;
    z-index: 11;
  }
  #rec:hover { background: #efd8b4; transform: translateY(-1px); }
  #rec:active { transform: translateY(0); }
  #rec:disabled { opacity: .6; cursor: default; }
  #dur {
    position: fixed; right: 18px; bottom: 100px;
    font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e8e8ea; background: rgba(20,20,26,.85); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 7px 12px; cursor: pointer; z-index: 11;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
  }
  #dur:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <canvas id="app"></canvas>
  <div class="hud"><b>Strawberry Matcha Latte</b> &nbsp;<span>drag to orbit · scroll to zoom</span></div>
  <div id="loader">preparing the scene…</div>
  <button id="snap" title="Render a high-resolution PNG">📸 Save photo</button>
  <button id="rec" title="Record a 360° turntable video">🎞 Record spin</button>
  <select id="dur" title="Turntable spin length (seamless loop)">
    <option value="4">4s spin</option>
    <option value="6">6s spin</option>
    <option value="8" selected>8s spin</option>
    <option value="12">12s spin</option>
    <option value="16">16s spin</option>
  </select>
