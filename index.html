<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💕 Memory Match</title>
<style>
  :root {
    --bg1: #ffd6e8;
    --bg2: #c8b6ff;
    --card-back: linear-gradient(135deg, #ff9bb3, #ff6f91);
    --card-front: #fffdf7;
    --accent: #ff4d6d;
    --ink: #4a3f55;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px;
    -webkit-tap-highlight-color: transparent;
  }

  h1 {
    margin: 6px 0 2px;
    font-size: 2rem;
    text-shadow: 0 2px 0 rgba(255,255,255,0.5);
  }

  .subtitle { margin: 0 0 14px; opacity: 0.75; font-size: 0.95rem; }

  .panel {
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.55);
    border-radius: 18px;
    padding: 12px 16px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
  }

  .players { display: flex; gap: 10px; flex: 1; }

  .player {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    border-radius: 12px;
    transition: all 0.25s ease;
    border: 2px solid transparent;
  }
  .player.active {
    background: rgba(255,255,255,0.9);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(255,77,109,0.25);
  }
  .player .name { font-weight: 700; font-size: 0.85rem; }
  .player .score { font-size: 1.4rem; font-weight: 800; color: var(--accent); }

  .controls { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 10px 16px;
    font-weight: 700;
    font-size: 0.9rem;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 4px 10px rgba(255,77,109,0.35);
    transition: transform 0.1s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.05); }
  button:active { transform: scale(0.95); }
  button.ghost { background: rgba(255,255,255,0.7); color: var(--ink); box-shadow: none; }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 460px;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 9vw, 2.6rem);
    backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    user-select: none;
  }
  .card-back {
    background: var(--card-back);
    color: #fff;
    font-size: 1.6rem;
  }
  .card-front {
    background: var(--card-front);
    transform: rotateY(180deg);
  }
  .card.matched .card-front {
    box-shadow: 0 0 0 3px #ffd166, 0 0 18px rgba(255,209,102,0.7);
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .win {
    position: fixed;
    inset: 0;
    background: rgba(74,63,85,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    backdrop-filter: blur(3px);
  }
  .win.show { display: flex; animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: #fff;
    border-radius: 22px;
    padding: 28px 30px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    animation: rise 0.4s ease;
  }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .win-card h2 { margin: 0 0 6px; font-size: 1.6rem; color: var(--accent); }
  .win-card p { margin: 6px 0 18px; }

  .footer { margin-top: 16px; font-size: 0.8rem; opacity: 0.6; text-align: center; }
</style>
</head>
<body>
  <h1>💕 Memory Match</h1>
  <p class="subtitle">Flip two cards. Find every pair. Play together!</p>

  <div class="panel">
    <div class="players">
      <div class="player" id="p1">
        <div class="name">💖 You</div>
        <div class="score" id="s1">0</div>
      </div>
      <div class="player" id="p2">
        <div class="name">💙 Her</div>
        <div class="score" id="s2">0</div>
      </div>
    </div>
    <div class="controls">
      <button id="restart">↻ New</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="footer">Moves: <span id="moves">0</span> · Match a pair to go again 🎉</div>

  <div class="win" id="win">
    <div class="win-card">
      <h2 id="winTitle">You won! 🎉</h2>
      <p id="winText"></p>
      <button id="playAgain">Play again 💕</button>
    </div>
  </div>

<script>
  const EMOJIS = ["🐱","🐶","🦊","🐰","🐼","🐨","🦁","🐯","🐸","🐵","🦄","🐧"];
  const PAIRS = 8; // 8 pairs = 16 cards (4x4 grid)

  const board   = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const s1El    = document.getElementById("s1");
  const s2El    = document.getElementById("s2");
  const p1El    = document.getElementById("p1");
  const p2El    = document.getElementById("p2");
  const winEl   = document.getElementById("win");

  let first = null, second = null;
  let lock = false;
  let moves = 0;
  let matchedCount = 0;
  let scores = [0, 0];
  let turn = 0; // 0 = player1, 1 = player2

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function updateTurnUI() {
    p1El.classList.toggle("active", turn === 0);
    p2El.classList.toggle("active", turn === 1);
  }

  function buildDeck() {
    const chosen = shuffle([...EMOJIS]).slice(0, PAIRS);
    const deck = shuffle([...chosen, ...chosen]);
    board.innerHTML = "";
    deck.forEach((emoji) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.emoji = emoji;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">❓</div>
          <div class="card-face card-front">${emoji}</div>
        </div>`;
      card.addEventListener("click", () => onFlip(card));
      board.appendChild(card);
    });
  }

  function onFlip(card) {
    if (lock) return;
    if (card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");

    if (!first) { first = card; return; }

    second = card;
    lock = true;
    moves++;
    movesEl.textContent = moves;

    if (first.dataset.emoji === second.dataset.emoji) {
      // match!
      setTimeout(() => {
        first.classList.add("matched");
        second.classList.add("matched");
        scores[turn]++;
        (turn === 0 ? s1El : s2El).textContent = scores[turn];
        matchedCount++;
        resetPick();
        if (matchedCount === PAIRS) endGame();
        // same player goes again on a match
      }, 350);
    } else {
      // no match -> flip back, switch turn
      setTimeout(() => {
        first.classList.remove("flipped");
        second.classList.remove("flipped");
        turn = turn === 0 ? 1 : 0;
        updateTurnUI();
        resetPick();
      }, 850);
    }
  }

  function resetPick() {
    first = null;
    second = null;
    lock = false;
  }

  function endGame() {
    const title = document.getElementById("winTitle");
    const text  = document.getElementById("winText");
    if (scores[0] === scores[1]) {
      title.textContent = "It's a tie! 🤝";
      text.textContent = `Both got ${scores[0]} pairs. Rematch?`;
    } else {
      const winner = scores[0] > scores[1] ? "💖 You" : "💙 Her";
      title.textContent = `${winner} won! 🎉`;
      text.textContent = `Final: ${scores[0]} – ${scores[1]} in ${moves} moves.`;
    }
    setTimeout(() => winEl.classList.add("show"), 400);
  }

  function newGame() {
    first = second = null;
    lock = false;
    moves = 0;
    matchedCount = 0;
    scores = [0, 0];
    turn = 0;
    movesEl.textContent = "0";
    s1El.textContent = "0";
    s2El.textContent = "0";
    winEl.classList.remove("show");
    updateTurnUI();
    buildDeck();
  }

  document.getElementById("restart").addEventListener("click", newGame);
  document.getElementById("playAgain").addEventListener("click", newGame);

  newGame();
</script>
</body>
</html>
